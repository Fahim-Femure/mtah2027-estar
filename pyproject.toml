[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtah-foundation"
version = "0.1.0"
description = "Local possession pipeline contracts and synthetic integration"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]
